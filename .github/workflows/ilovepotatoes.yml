name: Daily Contribution Streak

on:
  schedule:
    - cron: "15 0 * * *" # Runs daily at 00:15 UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update heartbeat file
        run: |
          mkdir -p .github
          echo "Last active: $(date -u)" > .github/daily-heartbeat.txt

      - name: Commit and push changes
        run: |
          git config --local user.name "alicia112233"
          git config --local user.email "alicia112233@users.noreply.github.com"
          git add .github/daily-heartbeat.txt
          git diff-index --quiet HEAD || (git commit -m "chore: automated daily streak update [skip ci]" && git push origin main)